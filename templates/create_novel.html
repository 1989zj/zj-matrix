<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>InkFlow - 创建新小说</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">

          extend: {
            "colors": {

                    "secondary-fixed-dim": "#c8c6c2",
                    "surface-dim": "#d0dbed",

                    "secondary-fixed": "#e4e2dd",
                    "on-background": "#121c2a",
                    "primary": "#630ed4",
                    "surface-container": "#e6eeff",
                    "on-tertiary-fixed": "#191c1f",
                    "primary-fixed": "#eaddff",
                    "tertiary-fixed-dim": "#c4c7ca",
                    "inverse-surface": "#27313f",
                    "surface-container-high": "#dee9fc",
                    "outline-variant": "#ccc3d8",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f8f9ff",
                    "surface": "#f8f9ff",
                    "surface-variant": "#d9e3f6",
                    "inverse-on-surface": "#eaf1ff",
                    "inverse-primary": "#d2bbff",
                    "tertiary-fixed": "#e0e2e6",
                    "on-secondary-container": "#63635f",
                    "tertiary-container": "#64676b",
                    "on-tertiary-container": "#e4e6ea",
                    "on-secondary-fixed": "#1b1c19",
                    "on-surface-variant": "#4a4455",
                    "on-primary-container": "#ede0ff",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#7c3aed",
                    "outline": "#7b7487",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#d2bbff",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#25005a",
                    "on-secondary": "#ffffff",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed-variant": "#44474a",
                    "surface-container-highest": "#d9e3f6",
                    "on-surface": "#121c2a",
                    "on-secondary-fixed-variant": "#474744",
                    "background": "#f8f9ff",
                    "secondary-container": "#e1dfdb",
                    "surface-container-low": "#eff4ff",
                    "tertiary": "#4c4f52"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1600px",
                    "margin-desktop": "24px",
                    "margin-mobile": "16px",
                    "gutter": "24px",
                    "editor-width": "720px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "headline-lg": ["Literata"],
                    "title-md": ["Literata"],
                    "body-md": ["Literata"],
                    "headline-lg-mobile": ["Literata"],

            },
            "fontSize": {

                    "title-md": ["20px", {"lineHeight": "1.5", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.8", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #f8f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 z-50">
<div class="flex items-center gap-4">
<a class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-bold text-primary no-underline" href="{{ url_for('admin.index') }}">NovelStudio</a>
</div>
<div class="flex items-center gap-4 text-on-surface-variant">
<button class="hover:text-primary transition-colors cursor-pointer active:opacity-70 p-2 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
<button class="hover:text-primary transition-colors cursor-pointer active:opacity-70 p-2 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant flex items-center justify-center bg-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center py-12 px-margin-mobile md:px-margin-desktop">
<!-- Header Container -->
<div class="max-w-[800px] w-full mb-8 text-center">
<h1 class="font-display-lg text-display-lg text-on-background mb-4">创建新作品</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">构建你的故事基石，开启一段新的旅程。</p>
</div>

<!-- Content Canvas (Form Area) -->
<div class="max-w-[1000px] w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm">
<h2 class="font-title-md text-title-md text-on-background mb-8 pb-4 border-b border-outline-variant">基础设定</h2>
<form class="space-y-6" id="create-form">
<!-- Input Group: Title -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="novel-title">作品名称</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" id="novel-title" placeholder="输入你想好的绝妙书名..." type="text" required/>
</div>
<!-- Bento Grid for Genre & Tags -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Genre Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="novel-genre">主要体裁</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none cursor-pointer" style="background-image: none;" id="novel-genre" required>
<option disabled="" selected="" value="">选择体裁...</option>
<option value="玄幻">玄幻东方</option>
<option value="奇幻">奇幻魔法</option>
<option value="武侠">武侠仙侠</option>
<option value="都市">都市职场</option>
<option value="历史">历史军事</option>
<option value="游戏">游戏竞技</option>
<option value="科幻">科幻未来</option>
<option value="悬疑">悬疑推理</option>
<option value="轻小说">轻小说</option>
<option value="言情">言情浪漫</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Target Word Count -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="novel-length">预计字数</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none cursor-pointer" style="background-image: none;" id="novel-length" required>
<option disabled="" selected="" value="">评估篇幅...</option>
<option value="short">短篇 (< 10万字)</option>
<option value="medium">中篇 (10万 - 50万字)</option>
<option value="long">长篇 (50万 - 200万字)</option>
<option value="epic">巨著 (200万 - 300万字)</option>
<option value="super_epic">鸿篇 (300万 - 500万字)</option>
<option value="legendary">神作 (> 500万字)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Tag Cloud Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant">作品标签 (多选)</label>
<div class="flex flex-wrap gap-2" id="tag-cloud">
<button class="tag-btn px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" data-tag="穿越" type="button">穿越</button>
<button class="tag-btn px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" data-tag="赛博朋克" type="button">赛博朋克</button>
<button class="tag-btn px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" data-tag="系统流" type="button">系统流</button>
<button class="tag-btn px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" data-tag="智斗" type="button">智斗</button>
<button class="tag-btn px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" data-tag="治愈" type="button">治愈</button>
</div>
</div>
<!-- Textarea: Logline/Summary -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="novel-summary">一句话简介 (Logline)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="novel-summary" placeholder="用简短的一句话描述你的故事核心冲突..." rows="3" maxlength="100"></textarea>
<p class="font-label-sm text-label-sm text-on-surface-variant text-right" id="char-count">0 / 100</p>
</div>
</form>
<!-- Bottom Action Bar -->
<div class="max-w-[720px] w-full mt-8 flex justify-between items-center">
<a href="{{ url_for('admin.index') }}" class="px-6 py-3 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 no-underline">
                取消创建
            </a>
<button class="px-8 py-3 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all flex items-center gap-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" id="submit-btn" type="submit" form="create-form">
<span id="btn-text">创建小说</span>
<span class="material-symbols-outlined text-[18px]" id="btn-icon">auto_awesome</span>
</button>
</div>
<!-- Feedback Toast -->
<div class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none" id="toast-container"></div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-4 bg-surface-container-low border-t border-outline-variant mt-auto">
<div class="flex justify-center items-center gap-gutter px-margin-desktop">
<span class="font-label-sm text-label-sm text-secondary">© 2024 InkFlow - Digital Sanctuary for Writers</span>
<div class="flex gap-4">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary hover:underline transition-all opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary hover:underline transition-all opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary hover:underline transition-all opacity-80 hover:opacity-100" href="#">Help Center</a>
</div>
</div>
</footer>
<script>
// ── Tag Toggle ──
document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const selected = btn.dataset.active === 'true';
        if (selected) {
            btn.dataset.active = 'false';
            btn.className = 'tag-btn px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors';
        } else {
            btn.dataset.active = 'true';
            btn.className = 'tag-btn px-4 py-2 rounded-full border border-primary bg-primary-container text-on-primary-container font-label-md text-label-md transition-colors';
        }
    });
});
// ── Character Counter ──
const summaryInput = document.getElementById('novel-summary');
const charCount = document.getElementById('char-count');
summaryInput.addEventListener('input', () => {
    const len = summaryInput.value.length;
    charCount.textContent = `${len} / 100`;
    charCount.className = `font-label-sm text-label-sm text-right ${len > 90 ? 'text-error' : 'text-on-surface-variant'}`;
});
// ── Toast System ──
function showToast(message, type) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    const bg = type === 'success' ? 'bg-primary text-on-primary' : 'bg-error-container text-on-error-container';
    const icon = type === 'success' ? 'check_circle' : 'error';
    toast.className = `flex items-center gap-3 px-5 py-4 rounded-xl shadow-lg pointer-events-auto animate-slide-in ${bg}`;
    toast.innerHTML = `<span class="material-symbols-outlined">${icon}</span><span class="font-body-md text-body-md">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 4000);
}
// ── Form Submission ──
document.getElementById('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('novel-title').value.trim();
    const genre = document.getElementById('novel-genre').value;
    const target = document.getElementById('novel-length').value;
    const summary = document.getElementById('novel-summary').value.trim();
    const tags = Array.from(document.querySelectorAll('.tag-btn[data-active="true"]')).map(b => b.dataset.tag);
    if (!title) { showToast('请填写作品名称', 'error'); return; }
    if (!genre) { showToast('请选择主要体裁', 'error'); return; }
    if (!target) { showToast('请选择预计字数', 'error'); return; }
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    btn.disabled = true; btnText.textContent = '正在创建...'; btnIcon.textContent = 'hourglass_top';
    try {
        const resp = await fetch('/api/novel/create/', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, genre, target, tags, summary})
        });
        const data = await resp.json();
        if (!resp.ok) { showToast(data.error || '创建失败', 'error'); btn.disabled = false; btnText.textContent = '创建小说'; btnIcon.textContent = 'auto_awesome'; return; }
        showToast(data.message || '创建成功！', 'success');
        setTimeout(() => { window.location.href = '/admin/'; }, 1500);
    } catch (err) {
        showToast('网络错误，请重试', 'error');
        btn.disabled = false; btnText.textContent = '创建小说'; btnIcon.textContent = 'auto_awesome';
    }
});
</script>
<style>
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</body></html>
