{% extends "base.html" %}
{% block title %}创建新小说 - NovelStudio{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-margin-desktop py-12">
    <div class="mb-10 text-center">
        <div class="w-20 h-20 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-4xl">auto_stories</span>
        </div>
        <h1 class="font-headline-lg text-4xl font-bold text-on-surface mb-2">开启一段新的创作旅程</h1>
        <p class="font-body-md text-on-surface-variant">填写基础设定，我们的 AI 工厂将为您构建世界观雏形</p>
    </div>

    <div class="bg-surface-container-lowest rounded-3xl p-10 border border-outline-variant shadow-xl space-y-8">
        <!-- Novel Title -->
        <div>
            <label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-3 font-bold tracking-wider">作品名称 (Novel Title)</label>
            <input type="text" id="novel-title" required class="w-full bg-surface-container-low border border-outline-variant rounded-2xl px-6 py-4 font-headline-lg text-2xl text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="例如：永恒之域的最后一丝微光">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Genre -->
            <div>
                <label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-3 font-bold tracking-wider">主要体裁 (Genre)</label>
                <select id="novel-genre" class="w-full bg-surface-container-low border border-outline-variant rounded-2xl px-6 py-4 font-body-lg text-on-surface focus:outline-none focus:border-primary transition-all appearance-none cursor-pointer">
                    <option value="" disabled selected>选择题材...</option>
                    <option value="玄幻奇幻">玄幻奇幻 / Fantasy</option>
                    <option value="都市言情">都市言情 / Urban Romance</option>
                    <option value="科幻未来">科幻未来 / Sci-Fi</option>
                    <option value="武侠仙侠">武侠仙侠 / Xianxia</option>
                    <option value="悬疑惊悚">悬疑惊悚 / Thriller</option>
                    <option value="历史架空">历史架空 / Historical</option>
                </select>
            </div>

            <!-- Target Length -->
            <div>
                <label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-3 font-bold tracking-wider">预计篇幅 (Length)</label>
                <select id="novel-target" class="w-full bg-surface-container-low border border-outline-variant rounded-2xl px-6 py-4 font-body-lg text-on-surface focus:outline-none focus:border-primary transition-all appearance-none cursor-pointer">
                    <option value="" disabled selected>选择规模...</option>
                    <option value="短篇">短篇 (1-5万字)</option>
                    <option value="中篇">中篇 (5-20万字)</option>
                    <option value="长篇">长篇 (20-100万字)</option>
                    <option value="超长篇">巨著 (100万字+)</option>
                </select>
            </div>
        </div>

        <!-- Tags -->
        <div>
            <label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-3 font-bold tracking-wider">核心标签 (Tags)</label>
            <input type="text" id="novel-tags" class="w-full bg-surface-container-low border border-outline-variant rounded-2xl px-6 py-4 font-body-md text-on-surface focus:outline-none focus:border-primary transition-all" placeholder="用逗号分隔，如：重生, 赛博朋克, 弱肉强食">
        </div>

        <!-- Summary -->
        <div>
            <label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-3 font-bold tracking-wider">核心冲突 / 简介 (Core Conflict)</label>
            <textarea id="novel-summary" rows="5" class="w-full bg-surface-container-low border border-outline-variant rounded-2xl px-6 py-4 font-body-md text-on-surface focus:outline-none focus:border-primary transition-all resize-none" placeholder="描述故事的核心看点或关键矛盾..."></textarea>
        </div>

        <div class="pt-4">
            <button onclick="createNovel()" id="submit-btn" class="w-full bg-primary text-on-primary py-5 rounded-2xl font-label-md text-label-md font-bold uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all shadow-xl shadow-primary/20 flex items-center justify-center gap-3">
                <span class="material-symbols-outlined">rocket_launch</span> 启动生成工厂
            </button>
        </div>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="fixed inset-0 bg-surface/80 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center">
    <div class="w-24 h-24 relative mb-8">
        <div class="absolute inset-0 rounded-full border-4 border-primary/20"></div>
        <div class="absolute inset-0 rounded-full border-4 border-primary border-t-transparent animate-spin"></div>
    </div>
    <h2 class="font-headline-lg text-2xl text-on-surface mb-2">正在构建世界观...</h2>
    <p class="font-body-md text-on-surface-variant animate-pulse">这可能需要几分钟，AI 正在深度思考设定细节</p>
</div>
{% endblock %}

{% block scripts %}
<script>
async function createNovel() {
    const title = document.getElementById('novel-title').value.trim();
    const genre = document.getElementById('novel-genre').value;
    const target = document.getElementById('novel-target').value;
    const tags = document.getElementById('novel-tags').value.split(',').map(s => s.trim()).filter(s => s);
    const summary = document.getElementById('novel-summary').value.trim();

    if (!title || !genre || !target) {
        alert('请填写必要的基本信息');
        return;
    }

    const overlay = document.getElementById('loading-overlay');
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');

    try {
        const resp = await fetch('/api/novel/create/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, genre, target, tags, summary})
        });
        const result = await resp.json();
        
        if (result.success) {
            alert(result.message);
            window.location.href = "{{ url_for('admin.index') }}";
        } else {
            alert('创建失败: ' + (result.detail || result.error));
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }
    } catch (e) {
        alert('网络错误');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
    }
}
</script>
{% endblock %}
