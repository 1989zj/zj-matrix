<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

"error-container": "#ffdad6",

"surface": "#f8f9ff",

"inverse-on-surface": "#eaf1ff",

"tertiary-container": "#64676b",
"on-tertiary-container": "#e4e6ea",
"on-secondary-fixed": "#1b1c19",
"on-surface-variant": "#4a4455",
"on-primary-container": "#ede0ff",
"on-tertiary": "#ffffff",
"primary-container": "#7c3aed",
"outline": "#7b7487",
"on-error": "#ffffff",
"primary-fixed-dim": "#d2bbff",
"on-primary": "#ffffff",
"surface-container-lowest": "#ffffff",
"on-primary-fixed": "#25005a",
"on-secondary": "#ffffff",
"error": "#ba1a1a",
"on-tertiary-fixed-variant": "#44474a",
"surface-container-highest": "#d9e3f6",
"on-surface": "#121c2a",
"on-secondary-fixed-variant": "#474744",

"secondary-container": "#e1dfdb",
"surface-container-low": "#eff4ff",
"tertiary": "#4c4f52"
},
"borderRadius": {

"full": "9999px"
},
"spacing": {
"container-max": "1200px",
"margin-desktop": "40px",
"margin-mobile": "16px",
"gutter": "24px",
"editor-width": "720px",
"unit": "8px"
},
"fontFamily": {
"headline-lg": ["Literata"],
"title-md": ["Literata"],
"body-md": ["Literata"],
"headline-lg-mobile": ["Literata"],

<style>
.material-symbols-outlined {
font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
</style>
</head>
<body class="bg-background min-h-screen flex text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">

<!-- 左侧氛围图 (Desktop Only) -->
<div class="hidden lg:flex lg:w-[55%] relative bg-inverse-surface overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAh1SSGPbibaV6V9pbLJ2EgNjs-UYavJ4N9vQiC7Bw45HK3uqew9kiWbazdNitdyKNarWKH-11L7sGQvSknbWAKXe6EFI-6cWbf8w1daaZ2ZmU84_BOrd4vq-tM-2ItkYR6hsYaQ8ZGq9UIzYLDllR4jeyr9Fb6Aszy4xr7Hdq6zH-LFBkG_H3D2sM8FZNrjbf5r818HaDTiYYYNL6kpB6HE7aqLXfvWCfv0qmFrV6IgKUrtZAw_ez4s015vFyoCmPtLCelro6RZQ');"></div>
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-[2px]"></div>
<div class="relative z-10 flex flex-col justify-end p-margin-desktop w-full max-w-3xl pb-32">
<h1 class="font-display-lg text-display-lg text-on-tertiary mb-6 leading-tight">
"写作，就是在一间黑屋子里，摸索着寻找那一线光。"
</h1>
<p class="font-title-md text-title-md text-on-tertiary/80">— 数字避难所</p>
</div>
</div>

<!-- 右侧登录面板 -->
<div class="w-full lg:w-[45%] flex items-center justify-center bg-surface-container-lowest p-margin-mobile md:p-margin-desktop min-h-screen shadow-[-10px_0_30px_rgba(0,0,0,0.02)] z-10 relative">
<div class="w-full max-w-[400px]">

<!-- 品牌头部 -->
<div class="mb-12 text-center lg:text-left">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-high text-primary mb-6">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">edit_note</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-3 tracking-tight">欢迎回到 NovelStudio</h2>
<p class="font-body-md text-body-md text-on-surface-variant">极简效能，专注你的文字创作</p>
</div>

<!-- 错误提示 -->
{% if error %}
<div class="mb-6 flex items-start gap-3 p-4 bg-error-container rounded-lg border border-error/20 animate-fadeIn">
<span class="material-symbols-outlined text-[20px] text-error flex-shrink-0 mt-0.5">error</span>
<p class="font-body-md text-body-md text-on-error-container">{{ error }}</p>
</div>
{% endif %}

<!-- 登录表单 -->
<form class="space-y-6" method="POST">
<input type="hidden" name="next" value="{{ next }}">

<!-- 手机号输入 -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">手机号码</label>
<div class="flex items-center border border-outline-variant rounded-DEFAULT focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200 bg-surface-container-lowest overflow-hidden group">
<!-- 区号选择 -->
<div class="flex items-center h-full px-4 border-r border-outline-variant bg-surface cursor-pointer hover:bg-surface-variant transition-colors group-focus-within:border-primary">
<span class="font-label-md text-label-md text-on-surface mr-1">+86</span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">arrow_drop_down</span>
</div>
<!-- 输入框 -->
<input class="flex-1 w-full bg-transparent border-none focus:ring-0 px-4 py-3.5 font-body-md text-body-md text-on-surface outline-none placeholder:text-outline" id="phone" name="phone" placeholder="请输入手机号" type="tel" required autofocus/>
</div>
</div>

<!-- 验证码输入 -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">验证码</label>
<div class="flex items-center border border-outline-variant rounded-DEFAULT focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200 bg-surface-container-lowest overflow-hidden">
<input class="flex-1 w-full bg-transparent border-none focus:ring-0 px-4 py-3.5 font-body-md text-body-md text-on-surface outline-none placeholder:text-outline" id="code" name="code" placeholder="6位数字验证码" type="text" required/>
<button class="h-full px-5 text-primary font-label-md text-label-md hover:bg-surface-variant active:bg-surface-container-high transition-colors whitespace-nowrap border-l border-outline-variant" id="btnSendCode" type="button">
获取验证码
</button>
</div>
</div>

<!-- 协议勾选 -->
<div class="flex items-start gap-3 pt-2">
<div class="relative flex items-center mt-0.5">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded-sm bg-surface-container-lowest checked:bg-primary checked:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-colors cursor-pointer" id="agreement" type="checkbox"/>
<span class="material-symbols-outlined absolute inset-0 text-[16px] text-on-primary pointer-events-none opacity-0 peer-checked:opacity-100 flex items-center justify-center">check</span>
</div>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer leading-relaxed" for="agreement">
我已阅读并同意 NovelStudio 的 <a class="text-primary hover:underline underline-offset-2" href="#">《服务协议》</a> 和 <a class="text-primary hover:underline underline-offset-2" href="#">《隐私政策》</a>。未注册的手机号将自动创建账号。
</label>
</div>

<!-- 提交按钮 -->
<button class="w-full py-4 mt-8 bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2 shadow-sm" type="submit">
<span>登录 / 注册</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>

<!-- 底部辅助 -->
<div class="mt-12 text-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">遇到问题？联系客服</a>
</div>

</div>
</div>

<script>
document.getElementById('btnSendCode').addEventListener('click', async function() {
    const phoneInput = document.getElementById('phone');
    const phone = phoneInput.value.trim();
    
    if (!/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入有效的手机号');
        return;
    }

    const btn = this;
    btn.disabled = true;
    
    try {
        const resp = await fetch('/api/auth/send-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone: phone})
        });
        const result = await resp.json();
        
        if (result.success) {
            let countdown = 60;
            btn.innerText = `${countdown}s`;
            const timer = setInterval(() => {
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.innerText = '获取验证码';
                    btn.disabled = false;
                } else {
                    btn.innerText = `${countdown}s`;
                    countdown--;
                }
            }, 1000);
            console.log('Mock SMS: ', result.message);
        } else {
            alert(result.error || '验证码发送失败');
            btn.disabled = false;
        }
    } catch (e) {
        alert('网络错误');
        btn.disabled = false;
    }
});

document.getElementById('agreement').addEventListener('change', function() {
    const submitBtn = document.querySelector('button[type="submit"]');
    if (submitBtn) {
        submitBtn.disabled = !this.checked;
        submitBtn.classList.toggle('opacity-50', !this.checked);
    }
});

// 页面加载时默认禁用提交按钮（未勾选协议）
window.addEventListener('DOMContentLoaded', function() {
    const submitBtn = document.querySelector('button[type="submit"]');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50');
    }
});
</script>

<style>
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fadeIn {
    animation: fadeIn 0.3s ease-out;
}
</style>
</body>
</html>
