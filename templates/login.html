<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - NovelStudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: var(--bs-tertiary-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            background-color: var(--bs-body-bg);
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--bs-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .btn-send-code {
            min-width: 110px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <a href="/" class="brand-logo">
        <i class="bi bi-pen-fill"></i>
        <span>NovelStudio</span>
    </a>

    <h4 class="text-center mb-4 fw-bold">手机快捷登录</h4>
    <p class="text-center text-secondary small mb-4">验证后自动注册/登录</p>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="next" value="{{ next }}">
        
        <div class="mb-3">
            <label for="phone" class="form-label small fw-semibold">手机号</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-secondary">
                    <i class="bi bi-phone"></i>
                </span>
                <input type="text" class="form-control border-start-0" id="phone" name="phone" required placeholder="请输入11位手机号" autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="code" class="form-label small fw-semibold">验证码</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-secondary">
                    <i class="bi bi-shield-lock"></i>
                </span>
                <input type="text" class="form-control border-start-0 border-end-0" id="code" name="code" required placeholder="6位验证码">
                <button class="btn btn-outline-primary btn-send-code" type="button" id="btnSendCode">获取验证码</button>
            </div>
        </div>

        <div class="d-grid mb-4">
            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">进入 NovelStudio</button>
        </div>

        <div class="text-center">
            <p class="x-small text-muted mb-0">登录即代表您同意 <a href="#" class="text-decoration-none">用户协议</a> 和 <a href="#" class="text-decoration-none">隐私政策</a></p>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('btnSendCode').addEventListener('click', async function() {
    const phoneInput = document.getElementById('phone');
    const phone = phoneInput.value.trim();
    
    if (!/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入有效的手机号');
        return;
    }

    const btn = this;
    btn.disabled = true;
    
    try {
        const resp = await fetch('/api/auth/send-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone: phone})
        });
        const result = await resp.json();
        
        if (result.success) {
            let countdown = 60;
            const timer = setInterval(() => {
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.innerText = '获取验证码';
                    btn.disabled = false;
                } else {
                    btn.innerText = `${countdown}s`;
                    countdown--;
                }
            }, 1000);
            console.log('Mock SMS: ', result.message);
        } else {
            alert(result.error || '验证码发送失败');
            btn.disabled = false;
        }
    } catch (e) {
        alert('网络错误');
        btn.disabled = false;
    }
});
</script>
</body>
</html>
