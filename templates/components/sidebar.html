<aside class="h-full w-64 bg-surface-container-lowest border-r border-outline-variant flex flex-col py-unit gap-2 z-10 shrink-0">
  {% if slug and meta %}
  <!-- Novel Specific Header -->
  <div class="px-4 py-6 border-b border-outline-variant mb-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded bg-primary-container text-on-primary-container flex items-center justify-center font-bold font-headline-lg text-headline-lg-mobile">
        {{ meta.title[0] if meta.title else '?' }}
      </div>
      <div class="min-w-0">
        <h2 class="font-title-md text-title-md text-on-surface truncate w-32" title="{{ meta.title }}">{{ meta.title }}</h2>
        <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">作品管理模式</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 px-2 flex flex-col gap-1">
    <a class="flex items-center gap-3 px-3 py-2 {% if request.path == url_for('novel.novel_detail', slug=slug) %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.novel_detail', slug=slug) }}">
      <span class="material-symbols-outlined {% if request.path == url_for('novel.novel_detail', slug=slug) %}fill{% endif %}">book</span>
      <span class="font-label-md text-label-md">作品主页</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if 'chapters' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.chapter_list', slug=slug) }}">
      <span class="material-symbols-outlined {% if 'chapters' in request.path %}fill{% endif %}">edit_note</span>
      <span class="font-label-md text-label-md">管理中心</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if '/world/' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.world_settings', slug=slug) }}">
      <span class="material-symbols-outlined {% if '/world/' in request.path %}fill{% endif %}">public</span>
      <span class="font-label-md text-label-md">世界观设定</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if '/power-system/' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.power_system', slug=slug) }}">
      <span class="material-symbols-outlined {% if '/power-system/' in request.path %}fill{% endif %}">bolt</span>
      <span class="font-label-md text-label-md">力量体系</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if 'characters' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.characters', slug=slug) }}">
      <span class="material-symbols-outlined {% if 'characters' in request.path %}fill{% endif %}">group</span>
      <span class="font-label-md text-label-md">角色管理</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if 'timeline' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.timeline', slug=slug) }}">
      <span class="material-symbols-outlined {% if 'timeline' in request.path %}fill{% endif %}">calendar_month</span>
      <span class="font-label-md text-label-md">故事时间线</span>
    </a>
  </nav>
  {% else %}
  <!-- Global Admin Sidebar -->
  <div class="px-4 py-6 border-b border-outline-variant mb-2">
    <h2 class="font-title-md text-title-md text-on-surface">系统管理</h2>
    <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">全局操作中心</p>
  </div>
  <nav class="flex-1 px-2 flex flex-col gap-1">
    <a class="flex items-center gap-3 px-3 py-2 {% if request.path == url_for('admin.index') or request.path == url_for('novel.index') %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('admin.index') }}">
      <span class="material-symbols-outlined {% if request.path == url_for('admin.index') %}fill{% endif %}">dashboard</span>
      <span class="font-label-md text-label-md">工作台</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if 'admin/orders' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('admin.admin_orders') }}">
      <span class="material-symbols-outlined {% if 'admin/orders' in request.path %}fill{% endif %}">assignment</span>
      <span class="font-label-md text-label-md">订单管理</span>
    </a>
    <a class="flex items-center gap-3 px-3 py-2 {% if 'downloads' in request.path %}bg-primary/10 text-primary font-bold{% else %}text-on-surface-variant hover:bg-surface-variant{% endif %} rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('novel.download_index') }}">
      <span class="material-symbols-outlined {% if 'downloads' in request.path %}fill{% endif %}">download</span>
      <span class="font-label-md text-label-md">下载中心</span>
    </a>
  </nav>
  {% endif %}

  <div class="mt-auto px-2 border-t border-outline-variant pt-2 flex flex-col gap-1">
    <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant hover:bg-surface-variant rounded-lg cursor-pointer transition-all duration-200 no-underline" href="{{ url_for('auth.logout') }}">
      <span class="material-symbols-outlined">logout</span>
      <span class="font-label-md text-label-md">退出系统</span>
    </a>
  </div>
</aside>
